<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Instagram Carousel Template</title>
<link rel="stylesheet" href="../tokens/fonts.css">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="_stage.css">
<style>
/* Each slide is 1080 x 1080. Shown at 50% scale; remove the zoom to export at full size. */
.row{zoom:.5}
.slide{width:1080px;height:1080px;padding:88px;display:flex;flex-direction:column;justify-content:space-between}
.pager{display:flex;gap:10px}.pager i{flex:1;height:8px;background:currentColor;opacity:.25}.pager i.on{opacity:1}
.h{font-family:var(--tff-font-display);font-weight:600;letter-spacing:-.04em;line-height:.98}
.foot{display:flex;justify-content:space-between;align-items:center}
</style></head><body>
<div><p class="spec">Instagram carousel · 1080 × 1080 · cover, step, data, close</p>
<div class="row">
  <div class="canvas slide" style="background:var(--tff-midnight);color:#fff">
    <div class="pager"><i class="on"></i><i></i><i></i><i></i><i></i></div>
    <h2 class="h" style="font-size:128px">3 numbers to check <span class="tff-accent" style="color:var(--tff-mist)">every Monday.</span></h2>
    <div class="foot"><span class="tff-label" style="font-size:28px;color:var(--tff-mist)">Swipe →</span><img src="../logos/svg/tff-wordmark-reverse.svg" alt="ten forty five" style="width:300px"></div>
  </div>
  <div class="canvas slide" style="background:var(--tff-cloud)">
    <div class="pager"><i></i><i class="on"></i><i></i><i></i><i></i></div>
    <div><div class="tff-label" style="font-size:28px;color:var(--tff-steel)">01 / Cost per lead</div><h2 class="h" style="font-size:96px;margin-top:32px">What you pay to start a conversation.</h2></div>
    <span class="tff-progress" style="width:64%;height:16px"></span>
  </div>
  <div class="canvas slide" style="background:#fff">
    <div class="pager"><i></i><i></i><i class="on"></i><i></i><i></i></div>
    <div><div class="tff-label" style="font-size:28px;color:var(--tff-steel)">02 / Lead-to-call rate</div><h2 class="h" style="font-size:96px;margin-top:32px">How many of those talk to you.</h2></div>
    <div class="h" style="font-size:220px;letter-spacing:-.05em">24%</div>
  </div>
  <div class="canvas slide" style="background:var(--tff-steel);color:#fff">
    <div class="pager"><i></i><i></i><i></i><i></i><i class="on"></i></div>
    <h2 class="h" style="font-size:112px">Track them for a month. <span class="tff-accent">Then we'll talk.</span></h2>
    <div class="foot"><span class="tff-label" style="font-size:28px">Save this post</span><img src="../logos/svg/tff-wordmark-on-steel.svg" alt="ten forty five" style="width:300px"></div>
  </div>
</div></div>
</body></html>
