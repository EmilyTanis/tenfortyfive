<!doctype html><html lang="en"><head><meta charset="utf-8"><title>LinkedIn Post Templates</title>
<link rel="stylesheet" href="../tokens/fonts.css">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="_stage.css">
<style>
.row{zoom:.5}
.post{width:1200px;height:1200px;padding:96px;display:flex;flex-direction:column;justify-content:space-between}
.wide{width:1200px;height:627px;padding:72px}
.h{font-family:var(--tff-font-display);font-weight:600;letter-spacing:-.04em;line-height:1}
.fig{font-family:var(--tff-font-display);font-weight:600;font-size:180px;letter-spacing:-.05em;line-height:1}
</style></head><body>
<div><p class="spec">Point of view · 1200 × 1200</p>
<div class="row"><div class="canvas post" style="background:var(--tff-midnight);color:#fff">
  <span class="tff-label" style="font-size:26px;color:var(--tff-mist)">Point of view</span>
  <h2 class="h" style="font-size:120px">Fix the funnel <span class="tff-accent" style="color:var(--tff-mist)">before</span> you fund the ads.</h2>
  <div style="display:flex;justify-content:space-between;align-items:center"><span class="tff-progress" style="width:240px;height:10px"></span><img src="../logos/svg/tff-wordmark-reverse.svg" alt="ten forty five" style="width:320px"></div>
</div></div></div>
<div><p class="spec">Client result · 1200 × 627 link image</p>
<div class="row"><div class="canvas post wide" style="background:var(--tff-cloud)">
  <span class="tff-label" style="font-size:24px;color:var(--tff-steel)">Client result · Home services</span>
  <div style="display:flex;gap:96px;align-items:flex-end">
    <div><div class="fig">−41%</div><span class="tff-label" style="font-size:24px;color:var(--tff-steel)">Cost per lead</span></div>
    <div><div class="fig">2.3×</div><span class="tff-label" style="font-size:24px;color:var(--tff-steel)">Booked calls</span></div>
  </div>
  <img src="../logos/svg/tff-wordmark-primary.svg" alt="ten forty five" style="width:300px">
</div></div></div>
</body></html>
