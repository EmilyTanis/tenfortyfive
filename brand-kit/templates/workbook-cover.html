<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Workbook Cover Template</title>
<link rel="stylesheet" href="../tokens/fonts.css">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="_stage.css">
<style>
@page{size:A4;margin:0}
.a4{width:794px;height:1123px;padding:72px;display:flex;flex-direction:column;justify-content:space-between;background:#fff;box-shadow:var(--tff-shadow-object)}
.bars{display:flex;flex-direction:column;gap:12px;margin-bottom:56px}.bars i{height:12px}
@media print{body{background:none;padding:0}.spec{display:none}.a4{box-shadow:none}}
</style></head><body>
<div><p class="spec">Workbook / lead magnet cover · A4 portrait</p>
<div class="canvas a4">
  <div style="display:flex;justify-content:space-between;align-items:center"><img src="../logos/svg/tff-wordmark-primary.svg" alt="ten forty five" style="width:190px"><span class="tff-label" style="color:var(--tff-steel)">Workbook 01</span></div>
  <div>
    <div class="bars"><i style="background:var(--tff-midnight);width:90%"></i><i style="background:var(--tff-steel);width:65%"></i><i style="background:var(--tff-mist);width:40%"></i></div>
    <h1 class="tff-h1" style="font-size:68px">The <span class="tff-accent" style="color:var(--tff-steel)">one-page</span><br>marketing plan.</h1>
    <p class="tff-body" style="font-size:20px;color:var(--tff-steel);margin-top:24px;max-width:30ch">A 45-minute workbook for owners who'd rather be running their business.</p>
  </div>
  <span class="tff-label" style="color:var(--tff-steel)">Free download · tenfortyfive.co/workbook</span>
</div></div>
</body></html>
